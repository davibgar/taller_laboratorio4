# Prometheus - Taller de Laboratorio N.º 4
# Lee cada 5 s: las métricas del APM (collector), las de MySQL (mysqld-exporter)
# y las estadísticas de los contenedores (monitor-contenedores).
# k6 le envía sus propias métricas por remote write (flag --web.enable-remote-write-receiver).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: apm
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
  - job_name: contenedores
    static_configs:
      - targets: ["monitor-contenedores:9200"]
